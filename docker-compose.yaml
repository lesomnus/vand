services:
  app:
    image: ghcr.io/lesomnus/vand:${REVISION:-local}
    command: [serve]

    network_mode: host
    privileged: true

    volumes:
      - ./vand.yaml:/vand.yaml:ro

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 64M
        reservations:
          cpus: "2"
          memory: 32M
